<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Beautiful Calculator</title>
  <link rel="stylesheet" type="text/css" href="style.css">
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500&display=swap" rel="stylesheet">
</head>
<body>
  <div class="calculator">
    <div class="tabs">
      <button class="tab-btn active" data-target="standard-calc">Standard</button>
      <button class="tab-btn" data-target="age-calc">Age</button>
    </div>

    <div id="standard-calc" class="calc-view active">
      <div class="display">
        <input type="text" id="result" disabled>
      </div>
      <div class="keys">
        <button data-action="clear" class="btn-action">C</button>
      <button data-action="negate" class="btn-action">±</button>
      <button data-action="percentage" class="btn-action">%</button>
      <button data-action="operator" data-value="/" class="btn-operator">÷</button>

      <button class="btn-number">7</button>
      <button class="btn-number">8</button>
      <button class="btn-number">9</button>
      <button data-action="operator" data-value="*" class="btn-operator">×</button>

      <button class="btn-number">4</button>
      <button class="btn-number">5</button>
      <button class="btn-number">6</button>
      <button data-action="operator" data-value="-" class="btn-operator">−</button>

      <button class="btn-number">1</button>
      <button class="btn-number">2</button>
      <button class="btn-number">3</button>
      <button data-action="operator" data-value="+" class="btn-operator">+</button>

      <button class="btn-number zero">0</button>
      <button data-action="decimal" class="btn-number">.</button>
      <button data-action="backspace" class="btn-action">⌫</button>
      <button data-action="calculate" class="btn-operator">=</button>
      </div>
    </div>

    <div id="age-calc" class="calc-view">
      <div style="text-align: right; margin-bottom: 10px;">
        <button id="toggle-date-mode" class="btn-action" style="font-size: 14px; padding: 5px 10px;">Manual Entry</button>
      </div>
      <div class="age-input-group" id="date-picker-group">
        <label for="dob">Date of Birth</label>
        <input type="date" id="dob">
      </div>
      <div class="age-input-group" id="manual-date-group" style="display: none;">
        <label>Date of Birth</label>
        <div class="manual-date-inputs">
          <input type="number" id="dob-day" placeholder="DD" min="1" max="31">
          <input type="number" id="dob-month" placeholder="MM" min="1" max="12">
          <input type="number" id="dob-year" placeholder="YYYY">
        </div>
      </div>
      <button id="calculate-age-btn" class="btn-operator" style="width: 100%; margin-top: 5px;">Calculate Age</button>
      <div id="age-result" class="age-result-display">
        <div class="age-placeholder">Select your date of birth</div>
      </div>
    </div>
  </div>
  <script src="script.js"></script>
</body>
</html>
