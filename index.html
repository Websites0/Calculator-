<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Beautiful Calculator</title>
  <link rel="stylesheet" type="text/css" href="style.css">
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500&display=swap" rel="stylesheet">
</head>
<body>
  <div class="calculator">
    <div class="display">
      <input type="text" id="result" disabled>
    </div>
    <div class="keys">
      <button data-action="clear" class="btn-action">C</button>
      <button data-action="negate" class="btn-action">±</button>
      <button data-action="percentage" class="btn-action">%</button>
      <button data-action="operator" data-value="/" class="btn-operator">÷</button>

      <button class="btn-number">7</button>
      <button class="btn-number">8</button>
      <button class="btn-number">9</button>
      <button data-action="operator" data-value="*" class="btn-operator">×</button>

      <button class="btn-number">4</button>
      <button class="btn-number">5</button>
      <button class="btn-number">6</button>
      <button data-action="operator" data-value="-" class="btn-operator">−</button>

      <button class="btn-number">1</button>
      <button class="btn-number">2</button>
      <button class="btn-number">3</button>
      <button data-action="operator" data-value="+" class="btn-operator">+</button>

      <button class="btn-number zero">0</button>
      <button data-action="decimal" class="btn-number">.</button>
      <button data-action="backspace" class="btn-action">⌫</button>
      <button data-action="calculate" class="btn-operator">=</button>
    </div>
  </div>
  <script src="script.js"></script>
</body>
</html>
